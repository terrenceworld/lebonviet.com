<head>
  <meta charset="UTF-8" />

  <title>Gallery — Le Bon Viêt</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      color: #1B2A4A;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 4rem;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(27,42,74,0.08);
    }
    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: #1B2A4A;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.35em;
    }
    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }
    .nav-links a {
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #1B2A4A;
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.3s;
    }
    .nav-links a:hover { opacity: 1; }
    .nav-links a.active { opacity: 1; color: #c8a96e; }

    /* ── Header ── */
    .gallery-header {
      padding: 10rem 6rem 4rem;
      text-align: center;
      border-bottom: 1px solid rgba(27,42,74,0.1);
    }
    .gallery-header .label {
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #c8a96e;
      margin-bottom: 1rem;
    }
    .gallery-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 400;
      color: #1B2A4A;
      margin-bottom: 1rem;
    }
    .gallery-header p {
      font-size: 0.85rem;
      color: #6a7a8a;
      letter-spacing: 0.05em;
    }
    .gold-line {
      display: block;
      width: 48px;
      height: 1px;
      background: #c8a96e;
      margin: 1.5rem auto;
    }

    /* ── Grid ── */
    .gallery-grid {
      columns: 3;
      column-gap: 1rem;
      padding: 3rem 4rem 6rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .gallery-item {
      break-inside: avoid;
      margin-bottom: 1rem;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      max-height: 520px;
    }
    .gallery-item img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    .gallery-item:hover img { transform: scale(1.03); }

    /* ── Lightbox ── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.97);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
    }
    #lightbox.open { display: flex; }
    #lightbox img {
      max-width: 80vw;
      max-height: 80vh;
      object-fit: contain;
    }
    .lb-close {
      position: absolute;
      top: 1.5rem; right: 2rem;
      font-size: 2rem;
      color: #1B2A4A;
      cursor: pointer;
      line-height: 1;
      opacity: 0.5;
      transition: opacity 0.2s;
    }
    .lb-close:hover { opacity: 1; }
    .lb-prev, .lb-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2rem;
      color: #1B2A4A;
      cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.2s;
      padding: 1rem;
      user-select: none;
    }
    .lb-prev { left: 1rem; }
    .lb-next { right: 1rem; }
    .lb-prev:hover, .lb-next:hover { opacity: 1; }

    /* ── Footer ── */
    footer {
      background: #080808;
      color: rgba(240,233,222,0.4);
      text-align: center;
      padding: 3rem;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
    }

    .nav-hamburger { display: none; }
    .mobile-menu { display: none; }

    @media (max-width: 900px) {
      .gallery-grid { columns: 2; padding: 2rem; }
      .gallery-header { padding: 8rem 2rem 3rem; }
      nav { padding: 1rem 2rem; }
    }
    @media (max-width: 560px) {
      .gallery-grid { columns: 1; }
      .nav-links { display: none; }
      .nav-hamburger {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
        cursor: pointer;
        padding: 4px;
        background: none;
        border: none;
      }
      .nav-hamburger span {
        display: block;
        width: 22px;
        height: 1.5px;
        background: #1B2A4A;
        transition: transform 0.3s, opacity 0.3s;
      }
      .nav-hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
      .nav-hamburger.open span:nth-child(2) { opacity: 0; }
      .nav-hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }
      .mobile-menu {
        position: fixed;
        inset: 0;
        background: rgba(255,255,255,0.97);
        z-index: 99;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.5rem;
      }
      .mobile-menu.open { display: flex; }
      .mobile-menu a {
        font-size: 0.75rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #1B2A4A;
        text-decoration: none;
      }
    }
  </style>

  <script>
    const items = Array.from(document.querySelectorAll('.gallery-item img'));
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');
    let cur = 0;

    function open(i) {
      cur = i;
      lbImg.src = items[cur].src;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function close() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
    }
    function prev() { cur = (cur - 1 + items.length) % items.length; lbImg.src = items[cur].src; }
    function next() { cur = (cur + 1) % items.length; lbImg.src = items[cur].src; }

    items.forEach((img, i) => img.parentElement.addEventListener('click', () => open(i)));
    document.getElementById('lbClose').addEventListener('click', close);
    document.getElementById('lbPrev').addEventListener('click', prev);
    document.getElementById('lbNext').addEventListener('click', next);
    lb.addEventListener('click', e => { if (e.target === lb) close(); });
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft') prev();
      if (e.key === 'ArrowRight') next();
    });
  </script>

  <script>
    // Shuffle gallery
    const grid = document.getElementById('galleryGrid');
    const items = Array.from(grid.children);
    for (let i = items.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      grid.appendChild(items[j]);
      [items[i], items[j]] = [items[j], items[i]];
    }
  </script>

  <script>
    const hamburger  = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('open');
      mobileMenu.classList.toggle('open');
      document.body.style.overflow = mobileMenu.classList.contains('open') ? 'hidden' : '';
    });
    document.querySelectorAll('.mobile-link').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('open');
        mobileMenu.classList.remove('open');
        document.body.style.overflow = '';
      });
    });
  </script>
